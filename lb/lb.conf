server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;   # Dockers inbyggda DNS, slår upp om var 5:e sekund

    location = /lb-health { return 200 "ok\n"; }

    location /api/ {
        set $api http://api:3000;   # variabel => DNS slås upp vid anrop => ser alla instanser
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        set $fe http://frontend:8080;
        proxy_pass $fe;
    }
}
