<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: .25rem; }
  #who { font-size: .85rem; color: #666; margin-bottom: 1rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .5rem; font-size: 1rem; }
  button { padding: .5rem .8rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; cursor: pointer; }
  li.done span { text-decoration: line-through; color: #999; }
</style>
</head>
<body>
<h1>Todo!</h1>
<div id="who">Svar från: …</div>
<form id="f"><input id="t" type="text" placeholder="Ny uppgift" maxlength="200" required><button>Lägg till</button></form>
<ul id="list"></ul>
<script>
const list = document.getElementById('list');
async function whoami() {
  const r = await (await fetch('/api/whoami')).json();
  document.getElementById('who').textContent = 'Svar från API-container: ' + r.hostname;
}
async function load() {
  const todos = await (await fetch('/api/todos')).json();
  list.innerHTML = '';
  for (const t of todos) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const s = document.createElement('span');
    s.textContent = t.title;
    s.onclick = async () => { await fetch('/api/todos/' + t.id, { method: 'PATCH' }); refresh(); };
    const b = document.createElement('button');
    b.textContent = 'Ta bort';
    b.onclick = async () => { await fetch('/api/todos/' + t.id, { method: 'DELETE' }); refresh(); };
    li.append(s, b);
    list.append(li);
  }
}
function refresh() { load(); whoami(); }
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const i = document.getElementById('t');
  await fetch('/api/todos', { method: 'POST', body: JSON.stringify({ title: i.value }) });
  i.value = '';
  refresh();
};
refresh();
</script>
</body>
</html>
